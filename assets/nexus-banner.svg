  <text x="640" y="558" text-anchor="middle" fill="#8DFFDD" font-family="Consolas, monospace" font-size="22" font-weight="700" letter-spacing="7">AUTONOMOUS DESKTOP AGENT // NEXUS TECH</text>
  <text x="74" y="586" fill="#6B7C77" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">MADE WITH LOVE FROM NIRANX, RESOLUTE TEAM</text>
  <text x="1206" y="586" text-anchor="end" fill="#6B7C77" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">nexus-desktop-app.vercel.app</text>
