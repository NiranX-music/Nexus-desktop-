    <circle cx="640" cy="304" r="102" stroke="#19F5B2" stroke-opacity="0.46" stroke-width="2"/>
    <circle cx="640" cy="304" r="42" fill="#020403" stroke="#E7FFF8" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M448 304C500 226 569 188 640 188C711 188 780 226 832 304C780 382 711 420 640 420C569 420 500 382 448 304Z" stroke="url(#accent)" stroke-width="5"/>
    <path d="M508 304C545 256 590 234 640 234C690 234 735 256 772 304C735 352 690 374 640 374C590 374 545 352 508 304Z" stroke="#E7FFF8" stroke-opacity="0.48" stroke-width="2"/>
