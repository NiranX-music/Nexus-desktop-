<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="80" fill="url(#nexusGlow)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="100" cy="100" r="75" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />
  
  <!-- Inner Hexagon Shield -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" 
           stroke="url(#nexusGrad)" stroke-width="3.5" fill="#090d16" fill-opacity="0.8" filter="url(#glow)"/>
           
  <!-- Core Neural Lattice / Quantum N -->
  <path d="M72 135 L72 65 L128 135 L128 65" 
        stroke="url(#nexusGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Quantum Nodes -->
  <circle cx="72" cy="65" r="5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="128" cy="65" r="5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="72" cy="135" r="5" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="128" cy="135" r="5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="100" cy="100" r="4" fill="#ffffff" filter="url(#glow)" />
</svg>
