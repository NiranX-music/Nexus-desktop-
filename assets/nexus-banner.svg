<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nexus AI neural desktop banner</title>
  <desc id="desc">A dark green command interface banner for Nexus AI by Nexus Tech.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(650 300) rotate(90) scale(280 430)">
      <stop stop-color="#21FFD0" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#00B784" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020604" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="72" y1="72" x2="1208" y2="568" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B16"/>
      <stop offset="0.55" stop-color="#020806"/>
      <stop offset="1" stop-color="#170B03"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="140" x2="1050" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DFFD5"/>
      <stop offset="0.6" stop-color="#11E5A5"/>
      <stop offset="1" stop-color="#FF8A2B"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#19F5B2" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#020403"/>
  <rect x="32" y="32" width="1216" height="576" rx="18" fill="url(#panel)" stroke="#18F5B0" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="32" y="32" width="1216" height="576" rx="18" fill="url(#grid)"/>
  <rect x="32" y="32" width="1216" height="576" rx="18" fill="url(#coreGlow)"/>
  <path d="M88 118H280M1000 118H1192M88 522H280M1000 522H1192" stroke="#1BFFD1" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M88 118V222M1192 118V222M88 418V522M1192 418V522" stroke="#1BFFD1" stroke-opacity="0.45" stroke-width="2"/>
