appId: com.resolutenexus.nexusai
productName: Nexus AI
copyright: Copyright © 2026 Resolute Nexus
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - build/icon.ico
  - package.json
  - '!**/node_modules/{monaco-editor,@xenova,three,@react-three,tldraw,@tldraw,katex,lucide-react,react-icons,recharts,reactflow,face-api.js,pdf-parse,mammoth,roughjs,xterm,xterm-addon-fit,tesseract.js}/**'
  - '!**/*.{map,ts,tsx}'
asarUnpack:
  - resources/**
  - node_modules/**/*.node

win:
  executableName: nexus-ai
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
    - target: portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  differentialPackage: false

  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Resolute Nexus
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false
publish:
  provider: generic
  url: https://nexusaix.vercel.app/updates/win
