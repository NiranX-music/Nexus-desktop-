name: "Nexus OS - Multi-Platform Binary Packaging CI/CD"

on:
  push:
    branches: [ "main", "release/*" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # Agent Epsilon: Linux Packaging (.AppImage & .deb)
  # ----------------------------------------------------------------------------
  build-linux:
    name: "Agent Epsilon - Linux Binaries (.AppImage / .deb)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libappindicator3-dev patchelf librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.5"

      - name: Build Linux Bundles
        run: cargo tauri build --target-dir src-tauri/target

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-binaries
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # ----------------------------------------------------------------------------
  # Agent Epsilon: Windows Desktop Setup (.exe)
  # ----------------------------------------------------------------------------
  build-windows:
    name: "Agent Epsilon - Windows Installer (.exe / .msi)"
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.5"

      - name: Build Windows Installer
        run: cargo tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ----------------------------------------------------------------------------
  # Agent Epsilon: Android Mobile Client (.apk)
  # ----------------------------------------------------------------------------
  build-android:
    name: "Agent Epsilon - Android Mobile Package (.apk)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Package Universal Android APK Stub
        run: |
          mkdir -p build/outputs/apk
          cp landing-site/binaries/nexus-mobile.apk build/outputs/apk/nexus-mobile-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: build/outputs/apk/*.apk
