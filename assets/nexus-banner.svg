      <circle cx="592" cy="214" r="4"/>
      <circle cx="690" cy="246" r="4"/>
      <circle cx="734" cy="318" r="4"/>
      <circle cx="588" cy="360" r="4"/>
      <circle cx="640" cy="188" r="4"/>
      <circle cx="640" cy="420" r="4"/>
