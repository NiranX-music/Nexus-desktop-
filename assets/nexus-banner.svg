    <path d="M122 266H330M122 302H286M122 338H318" stroke="#20F8B5" stroke-opacity="0.5" stroke-width="8"/>
    <circle cx="326" cy="334" r="14" fill="#21FFD0" fill-opacity="0.8"/>
  </g>
  <g opacity="0.78">
    <rect x="924" y="194" width="260" height="184" rx="10" fill="#020806" fill-opacity="0.72" stroke="#20F8B5" stroke-opacity="0.28"/>
    <text x="950" y="230" fill="#31FFD0" font-family="Consolas, monospace" font-size="18" font-weight="700" letter-spacing="5">AI GATEWAY</text>
    <path d="M950 266H1158M950 302H1102M950 338H1136" stroke="#20F8B5" stroke-opacity="0.5" stroke-width="8"/>
    <circle cx="1158" cy="334" r="14" fill="#FF8A2B" fill-opacity="0.9"/>
